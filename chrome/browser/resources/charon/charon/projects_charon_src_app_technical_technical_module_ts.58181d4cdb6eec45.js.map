<div
  class="container technical-page__container"
  *transloco="let translate; read: 'technical'"
>
  <svg-icon
    class="technical-page__logo-icon"
    key="logo-icon"
    size="xxl"
  ></svg-icon>

  <div class="technical-page__title" [innerHTML]="translate(i18nPageKey + '.title')"></div>

  <app-network-selector
    class="technical-page__network-selector"
    *ngIf="isNetworkSelectorVisible"
  ></app-network-selector>
</div>
